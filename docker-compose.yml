version: '3.8'

services:
  # Go 代理层 - 转发 LLM API 请求
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: llm-lens-proxy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - llm-lens-data:/data
    environment:
      - LLM_LENS_DB_PATH=/data/llm-lens.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Python API - REST API 接口
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: llm-lens-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - llm-lens-data:/data
    environment:
      - LLM_LENS_DB_PATH=/data/llm-lens.db
      - LLM_LENS_API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js 前端 - Dashboard
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: llm-lens-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: llm-lens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - proxy
      - api
      - web
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  llm-lens-data:
    driver: local
