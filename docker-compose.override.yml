# Docker Compose 开发环境配置
# 使用: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  # Go 代理层 - 开发模式
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./proxy:/app
      - llm-lens-data:/data
    environment:
      - LLM_LENS_DB_PATH=/data/llm-lens.db
      - LLM_LENS_LOG_LEVEL=debug

  # Python API - 开发模式
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - llm-lens-data:/data
    environment:
      - LLM_LENS_DB_PATH=/data/llm-lens.db
      - LLM_LENS_API_PORT=8000
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Next.js 前端 - 开发模式
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: ["npm", "run", "dev"]

volumes:
  llm-lens-data:
    driver: local
